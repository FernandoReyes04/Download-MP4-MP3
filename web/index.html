<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="descargar.ico">
<title>Video &amp; Audio Downloader</title>
<meta name="description" content="Descarga videos de YouTube e Instagram en máxima calidad como MP4 o MP3, de forma local.">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;min-height:100vh;color:#ededef;background:#161618;display:flex;justify-content:center;padding:44px 16px}
main{width:100%;max-width:600px}
h1{font-size:1.55rem;font-weight:600;color:#ededef;letter-spacing:-.02em}
.sub{color:#8e8e96;margin:4px 0 22px;font-size:.92rem}
.card{background:#202024;border:1px solid #2e2e33;border-radius:10px;padding:18px;margin-bottom:12px}
.row{display:flex;gap:8px}
input{flex:1;padding:11px 13px;border-radius:7px;border:1px solid #2e2e33;background:#161618;color:#ededef;font:inherit;font-size:.95rem;outline:none}
input:focus{border-color:#52525b}
button{font:inherit;font-size:.92rem;font-weight:500;cursor:pointer;border:1px solid transparent;border-radius:7px;padding:11px 18px;color:#141416;background:#e4e4e7;transition:.15s}
button:hover{background:#ffffff}
button:disabled{opacity:.45;pointer-events:none}
button.ghost{background:#202024;color:#ededef;border-color:#2e2e33}
button.ghost:hover{background:#2a2a30}
.meta{display:flex;gap:14px}
.meta img{width:140px;border-radius:6px;object-fit:cover;aspect-ratio:16/9;background:#161618}
.meta h2{font-size:1rem;font-weight:600;line-height:1.35}
.meta p{color:#8e8e96;font-size:.86rem;margin-top:4px}
.tabs{display:flex;gap:8px;margin:14px 0 10px}
.tab{flex:1;text-align:center;background:#161618;color:#ededef;border-color:#2e2e33}
.tab.on{background:#e4e4e7;color:#141416;border-color:#e4e4e7}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{padding:7px 13px;border-radius:6px;background:#161618;border:1px solid #2e2e33;font-size:.88rem;color:#8e8e96}
.chip.on{border-color:#e4e4e7;color:#ededef;background:#27272c}
.bar{height:6px;border-radius:4px;background:#161618;overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;width:0;background:#e4e4e7;transition:width .25s}
.err{color:#f87171}.hide{display:none}
small{color:#8e8e96;font-size:.82rem}
#upd,#appupd{display:flex;align-items:center;gap:12px;justify-content:space-between;background:#202024;border-color:#3f3f46}
footer{text-align:center;color:#8e8e96;font-size:.82rem;margin-top:8px}
footer label{cursor:pointer;margin-left:10px}
.hide,#upd.hide,#appupd.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Video &amp; Audio Downloader</h1>
<p class="sub">Descarga local en máxima calidad · MP4 y MP3</p>

<section id="upd" class="card hide"><span id="updtxt"></span><button id="updbtn" class="hide">Actualizar ahora</button></section>
<section id="appupd" class="card hide"><span id="appupdtxt"></span><button id="appupdbtn" class="hide">Actualizar programa</button></section>

<section class="card">
  <div class="row">
    <input id="url" placeholder="Pega el enlace del video…" autofocus>
    <button id="go">Analizar</button>
  </div>
  <p id="msg" class="err hide" style="margin-top:10px"></p>
</section>

<section class="card">
  <small>Carpeta de destino</small>
  <div class="row" style="margin-top:6px">
    <input id="dir" placeholder="C:\Users\...\Videos">
    <button id="browse" class="ghost">Examinar…</button>
    <button id="savedir" class="ghost">Guardar</button>
  </div>
  <p id="dirmsg" class="hide" style="margin-top:8px"><small></small></p>
</section>

<section id="panel" class="card hide">
  <div class="meta"><img id="thumb" alt="Miniatura"><div><h2 id="title"></h2><p id="info"></p></div></div>
  <div class="tabs">
    <button class="tab on" id="tmp4">MP4 (Video)</button>
    <button class="tab" id="tmp3">MP3 (Audio)</button>
  </div>
  <div class="opts" id="opts"></div>
  <button id="dl" style="width:100%">Descargar</button>
  <div id="prog" class="hide">
    <div class="bar"><i id="fill"></i></div>
    <small id="ptxt"></small>
    <div id="done" class="row hide" style="margin-top:10px">
      <button id="save" style="flex:1">Guardar archivo</button>
      <button id="folder" class="ghost">Abrir carpeta</button>
    </div>
  </div>
</section>
<footer><span id="ver"></span><label><input type="checkbox" id="auto" style="flex:none;width:auto"> Actualizar automáticamente</label></footer>
</main>
<script src="app.js"></script>
</body>
</html>
