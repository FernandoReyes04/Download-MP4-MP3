<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="descargar.ico">
<title>Descargador local de video y audio</title>
<meta name="description" content="Descarga videos de YouTube e Instagram en máxima calidad como MP4 o MP3, de forma local.">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:Outfit,sans-serif;min-height:100vh;color:#eef;background:#0b0b1a;display:flex;justify-content:center;padding:48px 16px;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(120px);opacity:.45;z-index:-1;animation:float 14s ease-in-out infinite alternate}
body::before{background:#7c3aed;top:-120px;left:-100px}
body::after{background:#06b6d4;bottom:-140px;right:-100px;animation-delay:-7s}
@keyframes float{to{transform:translate(80px,60px) scale(1.15)}}
main{width:100%;max-width:640px}
h1{font-size:2.4rem;font-weight:700;text-align:center;background:linear-gradient(90deg,#c4b5fd,#67e8f9);-webkit-background-clip:text;color:transparent}
.sub{text-align:center;opacity:.65;margin:8px 0 28px;font-weight:300}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px);border-radius:20px;padding:22px;margin-bottom:18px;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.row{display:flex;gap:10px}
input{flex:1;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.35);color:#fff;font:inherit;outline:none;transition:.2s}
input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.25)}
button{font:inherit;font-weight:500;cursor:pointer;border:0;border-radius:12px;padding:14px 22px;color:#fff;background:linear-gradient(135deg,#7c3aed,#06b6d4);transition:.2s}
button:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,.4)}
button:disabled{opacity:.5;pointer-events:none}
button.ghost{background:rgba(255,255,255,.08)}
.meta{display:flex;gap:16px}
.meta img{width:160px;border-radius:12px;object-fit:cover;aspect-ratio:16/9}
.meta h2{font-size:1.1rem;font-weight:500;line-height:1.3}
.meta p{opacity:.6;font-size:.9rem;margin-top:6px}
.tabs{display:flex;gap:8px;margin:18px 0 12px}
.tab{flex:1;text-align:center;background:rgba(255,255,255,.07)}
.tab.on{background:linear-gradient(135deg,#7c3aed,#06b6d4)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid transparent;font-size:.95rem}
.chip.on{border-color:#67e8f9;background:rgba(103,232,249,.15)}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#06b6d4);transition:width .3s}
.err{color:#fca5a5}
small{opacity:.7}
#upd{display:flex;align-items:center;gap:12px;justify-content:space-between;background:rgba(103,232,249,.12);border-color:rgba(103,232,249,.4)}
footer{text-align:center;opacity:.7;font-size:.85rem;margin-top:8px}
footer label{cursor:pointer;margin-left:10px}
.hide,#upd.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Video &amp; Audio Downloader</h1>
<p class="sub">YouTube · Instagram · y más — local, privado, máxima calidad</p>

<section id="upd" class="card hide"><span id="updtxt"></span><button id="updbtn" class="hide">Actualizar ahora</button></section>

<section class="card">
  <div class="row">
    <input id="url" placeholder="Pega el enlace del video…" autofocus>
    <button id="go">Analizar</button>
  </div>
  <p id="msg" class="err hide" style="margin-top:12px"></p>
</section>

<section class="card">
  <small>📁 Carpeta de destino</small>
  <div class="row" style="margin-top:8px">
    <input id="dir" placeholder="C:\Users\...\Videos">
    <button id="browse" class="ghost">Examinar…</button>
    <button id="savedir" class="ghost">Guardar</button>
  </div>
  <p id="dirmsg" class="hide" style="margin-top:8px"><small></small></p>
</section>

<section id="panel" class="card hide">
  <div class="meta"><img id="thumb" alt="Miniatura"><div><h2 id="title"></h2><p id="info"></p></div></div>
  <div class="tabs">
    <button class="tab on" id="tmp4">🎬 MP4 (video)</button>
    <button class="tab" id="tmp3">🎵 MP3 (audio)</button>
  </div>
  <div class="opts" id="opts"></div>
  <button id="dl" style="width:100%">Descargar</button>
  <div id="prog" class="hide">
    <div class="bar"><i id="fill"></i></div>
    <small id="ptxt"></small>
    <div id="done" class="row hide" style="margin-top:12px">
      <button id="save" style="flex:1">Guardar archivo</button>
      <button id="folder" class="ghost">Abrir carpeta</button>
    </div>
  </div>
</section>
<footer><span id="ver"></span><label><input type="checkbox" id="auto" style="flex:none;width:auto"> Actualizar automáticamente</label></footer>
</main>
<script src="app.js"></script>
</body>
</html>
